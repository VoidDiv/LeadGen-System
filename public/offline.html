<!doctype html>
<!-- FILE: public/offline.html (NEW) - shown when a page is opened with no internet and was never saved before -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15223b" />
    <title>Offline | GFI Lead Dashboard</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #15223b;
        color: #1e293b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        text-align: center;
      }
      img { width: 56px; height: 56px; border-radius: 12px; }
      h1 { margin: 16px 0 6px; font-size: 18px; color: #0f172a; }
      p { margin: 0; font-size: 14px; line-height: 1.5; color: #475569; }
      button {
        margin-top: 20px;
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #15223b;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #c49e4a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>No internet connection</h1>
      <p>This page hasn't been opened on this phone yet, so there's no saved copy. Pages you've opened before still work offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
